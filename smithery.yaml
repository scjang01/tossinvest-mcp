startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Toss Securities OAuth Client ID (TOSSINVEST_CLIENT_ID)"
      secretKey:
        type: string
        description: "Toss Securities OAuth Client Secret (TOSSINVEST_CLIENT_SECRET)"
      account:
        type: string
        description: "Optional fixed account sequence (TOSSINVEST_ACCOUNT). If omitted, tools require accountSeq."
      enableTrading:
        type: boolean
        description: "Enable order creation, modification, and cancellation tools (TOSSINVEST_ENABLE_TRADING). Disabled by default."
        default: false
    required:
      - apiKey
      - secretKey
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "tossinvest-mcp"],
      env: {
        TOSSINVEST_CLIENT_ID: config.apiKey,
        TOSSINVEST_CLIENT_SECRET: config.secretKey,
        TOSSINVEST_ACCOUNT: config.account ?? "",
        TOSSINVEST_ENABLE_TRADING: config.enableTrading ? "true" : "false"
      }
    })
